          sigcase INT 130
          # Mode preservation is EXACT (stat+chmod, not cp-through-umask): a non-default 0664
          # policy must still be 0664 after a successful backfill.
          MP="$(mktemp -d)"; ( cd "$MP" && git init -qb main . >/dev/null && "$GITHUB_WORKSPACE/bin/plinth" init "$MP" >/dev/null 2>&1 )
          printf '(^|/)my-rule$\n' > "$MP/.plinth/protected-paths"
          chmod 664 "$MP/.plinth/protected-paths"
          "$GITHUB_WORKSPACE/bin/plinth" update "$MP" >/dev/null 2>&1 || { echo "::error::update failed on a 0664 policy"; exit 1; }
