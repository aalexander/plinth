          [ "$mm" = "664" ] || { echo "::error::policy mode not preserved exactly (0664 -> 0$mm)"; exit 1; }
          grep -qxF '(^|/)\.plinth/session/' "$MP/.plinth/protected-paths" || { echo "::error::0664 policy was not backfilled"; exit 1; }
