          grep -q '^capped() {' "$CAPX" || { echo "::error::could not extract hookprobe capped() from bin/plinth"; exit 1; }
          cs="$(date +%s)"; r=0
          bash -c 'tmo=""; cap=1; source "$1"; capped bash -c '"'"'trap "" TERM; sleep 30'"'"'' _ "$CAPX" >/dev/null 2>&1 || r=$?
          ce="$(date +%s)"
          { [ "$r" = 124 ] && [ "$(( ce - cs ))" -lt 15 ]; } || { echo "::error::hookprobe capped() python fallback did not TERM->KILL a signal-ignoring child (exit=$r elapsed=$(( ce-cs ))s; want 124)"; exit 1; }
          # a cap of 0 DISABLES GNU `timeout` entirely (and a non-numeric value is meaningless); both
          # must be rejected as INCONCLUSIVE(4), never run uncapped (a silent hard-cap bypass):
          printf '#!/usr/bin/env bash\n[ "${1:-}" = --version ] && { echo v; exit 0; }\ntouch cli-ran.txt\necho done\n' > "$HPB/grok"; chmod +x "$HPB/grok"
          for badcap in 0 abc -1; do
            rc=0; out="$(PLINTH_HOOKPROBE_TIMEOUT="$badcap" PATH="$HPB:$PATH" "$GITHUB_WORKSPACE/bin/plinth" hookprobe grok 2>&1)" || rc=$?
            [ "$rc" = 4 ] || { echo "::error::hookprobe ran with an invalid cap '$badcap' (rc=$rc, want 4 — 0 disables the timeout)"; exit 1; }
          done
          # SAFETY-CRITICAL: a scratch dir under a TMPDIR CONTAINING A SPACE must not break the hook
          # command (unquoted path would split, the hook would never fire, and hookprobe would FALSELY
          # report NONE — contradicting "NONE = unenforced"). Build settings with json/shlex; expect ALL FOUR.
          cat > "$HPB/grok" <<'HPSP'
          #!/usr/bin/env bash
          [ "${1:-}" = --version ] && { echo v; exit 0; }
          touch cli-ran.txt
          jq -r '.hooks[][]?.hooks[]?.command' .claude/settings.json 2>/dev/null | while IFS= read -r c; do sh -c "$c" </dev/null; done
          echo done
          HPSP
          chmod +x "$HPB/grok"
          for meta in 'dir with space' 'ta`x`tick' 'd$(x)ollar'; do
            SPT="$(mktemp -d)/$meta"; mkdir -p "$SPT"
            rc=0; out="$(TMPDIR="$SPT" PATH="$HPB:$PATH" "$GITHUB_WORKSPACE/bin/plinth" hookprobe grok 2>&1)" || rc=$?
            { [ "$rc" = 0 ] && printf '%s' "$out" | grep -q "ALL FOUR"; } || { echo "::error::hookprobe under a METACHARACTER TMPDIR ('$meta') mis-fired the hooks / read them as NONE (rc=$rc) — probe.sh or settings.json path is not quoted: $out"; exit 1; }
          done
