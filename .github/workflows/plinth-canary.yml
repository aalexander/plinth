          SPB="$(mktemp -d)"; printf '#!/usr/bin/env bash\n[ "${1:-}" = --version ] && { echo v; exit 0; }\ntouch cli-ran.txt\necho done\n' > "$SPB/grok"; chmod +x "$SPB/grok"
          printf '#!/usr/bin/env bash\nexit 1\n' > "$SPB/python3"; chmod +x "$SPB/python3"
