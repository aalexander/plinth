name: plinth-receipt

# The APPROVED-at-HEAD receipt check (auto mode, v4.7): a required status
# context that, WHEN THIS WORKFLOW RUNS, verifies a git-note receipt for the
# PR head against the PR subject via receipt-verify.sh (fetched from this
# reusable workflow's own pinned uses: ref via github.job_workflow_ref — never
# from the PR working tree).
# Fails closed when it runs: no receipt, stale receipt, non-APPROVED, subject
# mismatch, or an undisclosed override.
#
# HONEST BOUND (caller control): on pull_request, GitHub executes workflow files
# from the PR head. A PR can replace the caller job that reports the required
# context name `receipt / verify` with a different always-green job of the same
# name — then THIS reusable workflow never runs. The base-pin comparison below
# only executes when this workflow runs; it closes "repoint uses: at a fork"
# while this job still executes. It does NOT make the required context name
# cryptographically bound to this verifier. Bootstrap: land the receipt job on
# the base first, then require the context + strict:true. Fabricating a real
# receipt note without running the loop remains detectable/auditable, not
# cryptographically impossible.
#
# SUBJECT-AS-OF-EXECUTION: this job verifies the PR subject at the moment it
# runs. The live base.sha comparison detects base movement only WHILE the job is
# running. After a green exit the base can still advance while the PR head and
# this successful status remain unchanged — no status check can invalidate itself
# post-success. The mechanism that closes that window is GitHub branch protection
# "Require branches to be up to date before merging" (`strict: true`) wherever
# `receipt / verify` is a required context. Do not invent an in-workflow claim
# that covers post-success base movement; document the bound and require strict.
#
# v1 LIMITS (fail closed, never silently pass):
# - pull_request events only. GitHub merge queues rewrite SHAs into synthetic
#   heads no local loop ever approved — exact-HEAD semantics cannot be
#   inherited; do not enable a merge queue with this check required.
# - Receipts are fetched from the BASE repository's notes ref. A fork driver
#   cannot push notes there, so fork PRs fail closed — the estate's flow is
#   same-repo branches.

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported events (fail closed)
        if: github.event_name != 'pull_request'
        run: |
          echo "::error::plinth-receipt v1 verifies pull_request events only (got ${{ github.event_name }}); merge queues rewrite SHAs — the synthetic head was never approved by any loop"
          exit 1
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Verify the APPROVED-at-HEAD receipt
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          JOB_WF_REF: ${{ github.job_workflow_ref }}
        run: |
          set -euo pipefail
          # Verifier comes from THIS workflow's own uses: pin — BOTH halves of it.
          # job_workflow_ref has the form `OWNER/REPO/<path>@REF`, so the repository
          # AND the commit both come from the caller's pin and nothing else. An
          # earlier revision took only the @REF here and built the URL from
          # github.repository_owner (the CALLING repo's owner), which silently broke
          # the property this docblock advertises: an org repo consuming a
          # personally-owned plinth (or a renamed/forked source) would fetch the
          # wrong repository — or none — even though job_workflow_ref named the right
          # one. Never reintroduce a second source for either half.
          [ -n "${JOB_WF_REF:-}" ] || { echo "::error::github.job_workflow_ref is empty — expected for a reusable workflow call; cannot resolve the verifier pin"; exit 1; }
          case "$JOB_WF_REF" in
            *@*) ref="${JOB_WF_REF##*@}" ;;
            *) echo "::error::github.job_workflow_ref has no @ref (got ${JOB_WF_REF}) — cannot resolve the verifier pin"; exit 1 ;;
          esac
          [ -n "$ref" ] || { echo "::error::empty ref after last @ in job_workflow_ref (${JOB_WF_REF}) — cannot resolve the verifier pin"; exit 1; }
          # OWNER/REPO = everything before the workflow path. Require the `/.github/`
          # separator and an `owner/repo` shape, so a malformed value fails closed
          # instead of composing a plausible-but-wrong URL.
          case "$JOB_WF_REF" in
            */.github/*) wf_nwo="${JOB_WF_REF%%/.github/*}" ;;
            *) echo "::error::github.job_workflow_ref has no /.github/ path segment (got ${JOB_WF_REF}) — cannot resolve the verifier repository"; exit 1 ;;
          esac
          case "$wf_nwo" in
            */*/*|*/) echo "::error::unexpected owner/repo in job_workflow_ref (got ${wf_nwo}) — cannot resolve the verifier repository"; exit 1 ;;
            */*) : ;;
            *) echo "::error::job_workflow_ref does not name owner/repo (got ${wf_nwo}) — cannot resolve the verifier repository"; exit 1 ;;
          esac
          # ── The verifier pin must match the BASE branch's, not the PR's ─────────────
          # BYPASS THIS CLOSES (when this job runs): on pull_request, job_workflow_ref
          # reflects the PR's chosen uses: pin. Without this check a PR could repoint
          # its receipt: job at attacker/evil-plinth/...@sha whose verify exits 0 while
          # still invoking a job named receipt/verify. Requiring equality with the base
          # branch's pin stops that class IF this reusable workflow still executes.
          #
          # BYPASS THIS DOES NOT CLOSE: a PR that replaces the caller job entirely with
          # a local always-green job that only reuses the context *name* `receipt / verify`
          # — then this file never runs and this comparison never fires. That is a GitHub
          # Actions topology limit (workflow files come from the PR head). Documented in
          # MANUAL; do not claim this check makes the context name unforgeable.
          #
          # The base branch is not PR-writable; the pin recorded THERE is the operator's
          # when the job on the base is present. Require the running pin to equal it.
          base_ci="$(git show "origin/${BASE_REF}:.github/workflows/ci.yml" 2>/dev/null || true)"
          [ -n "$base_ci" ] || { echo "::error::cannot read .github/workflows/ci.yml from origin/${BASE_REF} — the verifier pin cannot be anchored to the base, so this check refuses to run (fail closed)"; exit 1; }
          base_uses="$(printf '%s\n' "$base_ci" | grep -E '^[[:space:]]*["'"'"']?uses["'"'"']?[[:space:]]*:.*plinth-receipt\.yml@' | head -1 || true)"
          if [ -z "$base_uses" ]; then
            echo "::error::the base branch (origin/${BASE_REF}) does not wire a plinth-receipt.yml job, so there is no operator-owned pin to anchor against — a PR-supplied pin must never be trusted. Land the receipt job in ci.yml on ${BASE_REF} FIRST, then require the 'receipt / verify' context AND set required_status_checks.strict=true (that is the documented enabling order; strict is not optional — this check verifies the subject as of execution, so without it a green result can describe a base that has since moved)."
            exit 1
          fi
          # Compare owner/repo@ref, ignoring surrounding quotes and any trailing comment.
          base_pin="$(printf '%s' "$base_uses" | sed -E 's/^[[:space:]]*["'"'"']?uses["'"'"']?[[:space:]]*:[[:space:]]*//; s/[[:space:]]+#.*$//; s/^["'"'"']//; s/["'"'"'][[:space:]]*$//')"
          run_pin="${wf_nwo}/.github/workflows/plinth-receipt.yml@${ref}"
          [ "$base_pin" = "$run_pin" ] || {
            echo "::error::the receipt verifier pin differs from the one on origin/${BASE_REF}."
            echo "::error::  base (operator-owned, trusted): ${base_pin}"
            echo "::error::  running (from this PR's ci.yml): ${run_pin}"
            echo "::error::A PR cannot choose which verifier judges it. Revert the receipt job's uses: line, or land the repin on ${BASE_REF} first."
            exit 1
          }
          # Clear first: a GitHub-hosted runner is ephemeral, but a REUSED/self-hosted one
          # can carry a stale /tmp/plinth from a prior job (a partial failure leaves the dir
          # behind), and `remote add origin` then dies with "already exists" — a confusing
          # failure with nothing to do with the receipt. The canary's own fixture clears it
          # between cases; the production step must not rely on a fresh VM to be correct.
          rm -rf /tmp/plinth
          git init -q /tmp/plinth
          git -C /tmp/plinth remote add origin "https://github.com/${wf_nwo}"
          git -C /tmp/plinth fetch -q --depth 1 origin "$ref" \
            || { echo "::error::cannot fetch ${wf_nwo}@${ref} (both from job_workflow_ref) — missing commit, or that repo not readable from Actions"; exit 1; }
          git -C /tmp/plinth checkout -q FETCH_HEAD
          VERIFY=/tmp/plinth/shared/.plinth/receipt-verify.sh
          [ -f "$VERIFY" ] || { echo "::error::pinned plinth ref (${ref}) predates the receipt check (no receipt-verify.sh) — repin uses: to v4.7+"; exit 1; }
          chmod +x "$VERIFY"
          # The PR head object must exist locally even for fork PRs (the base
          # repo serves it via the pull ref); the notes ref comes from the BASE
          # repo only — that is the point.
          git fetch -q origin "+refs/pull/${PR_NUM}/head:refs/plinth/prhead" \
            || { echo "::error::cannot fetch the PR head ref"; exit 1; }
          # Distinguish "the ref is legitimately absent" from "the probe failed"
          # (network/auth) before blaming the driver. `git ls-remote --exit-code`
          # returns 2 when no matching ref exists; any other nonzero is infrastructure.
          # HEAL-CI asks the operator to classify a red check as transient vs real
          # defect, which is impossible if both render as the same message.
          notes_probe_rc=0
          git ls-remote --exit-code origin 'refs/notes/plinth-receipts' >/dev/null 2>&1 || notes_probe_rc=$?
          if [ "$notes_probe_rc" = 0 ]; then
            git fetch -q origin '+refs/notes/plinth-receipts:refs/notes/plinth-receipts' \
              || { echo "::error::refs/notes/plinth-receipts EXISTS on the remote but could not be fetched — this is an infrastructure failure (network/auth), not a missing receipt. Re-run the check; if it persists, treat it as a real defect per HEAL-CI."; exit 1; }
          elif [ "$notes_probe_rc" = 2 ]; then
            echo "::error::no refs/notes/plinth-receipts on this repository — the review loop mints it on APPROVED; push it with the branch: git push origin HEAD refs/notes/plinth-receipts"
            exit 1
          else
            echo "::error::could not probe refs/notes/plinth-receipts on the remote (git ls-remote exit ${notes_probe_rc}) — this is an infrastructure failure (network/auth), not a proven missing receipt. Re-run the check; if it persists, treat it as a real defect per HEAL-CI."
            exit 1
          fi
          git notes --ref=plinth-receipts show "$HEAD_SHA" > receipt.json 2>/dev/null || rm -f receipt.json
          # PR body via the event payload file — never shell-interpolated.
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > pr-body.txt
          # Bind the base tip once, then re-check it against the live PR's base.sha
          # in the TOCTOU block below — a base movement mid-run can change the merge
          # base and make a successful verify describe an obsolete subject.
          BASE_TIP="$(git rev-parse "origin/${BASE_REF}")"
          "$VERIFY" --receipt receipt.json --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" --base-tip "$BASE_TIP" \
            --pr-body pr-body.txt --repo "${{ github.repository }}"
          # TOCTOU: re-fetch the live PR just before success — a head, base tip, or
          # body swap mid-run must invalidate this run, not ride its green check.
          live="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" --jq '{sha: .head.sha, base_sha: .base.sha, body: (.body // "")}')"
          [ "$(jq -r .sha <<<"$live")" = "$HEAD_SHA" ] \
            || { echo "::error::PR head changed while verifying — re-run the check"; exit 1; }
          [ "$(jq -r .base_sha <<<"$live")" = "$BASE_TIP" ] \
            || { echo "::error::PR base tip changed while verifying (merge base may differ from the verified subject) — re-run the check"; exit 1; }
          jq -r .body <<<"$live" > pr-body-live.txt
          cmp -s pr-body.txt pr-body-live.txt \
            || { echo "::error::PR body changed while verifying (override disclosure could differ) — re-run the check"; exit 1; }
          echo "receipt verified: APPROVED at ${HEAD_SHA}"
