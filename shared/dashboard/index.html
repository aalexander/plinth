<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plinth dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-card-hi: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --dim: #6e7681;
    --green: #3fb950;
    --green-bg: rgba(63, 185, 80, 0.12);
    --red: #f85149;
    --red-bg: rgba(248, 81, 73, 0.12);
    --yellow: #d29922;
    --yellow-bg: rgba(210, 153, 34, 0.12);
    --cyan: #39d2c0;
    --cyan-bg: rgba(57, 210, 192, 0.10);
    --purple: #a371f7;
    --orange: #f0883e;
    --font: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(57, 210, 192, 0.08), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(163, 113, 247, 0.05), transparent);
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1.25rem 1.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13, 17, 23, 0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-family: var(--font);
    color: var(--cyan);
  }
  header h1 span { color: var(--muted); font-weight: 400; }
  .meta {
    font-family: var(--font);
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .meta .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    display: inline-block;
  }
  .meta .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .meta .dot.spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  #quota-bar {
    padding: 0.55rem 1.5rem 0.7rem;
    border-bottom: 1px solid var(--border);
    background: rgba(22, 27, 34, 0.85);
    font-family: var(--font);
    font-size: 0.72rem;
    color: var(--muted);
  }
  #quota-bar .qrow {
    display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
    align-items: center;
  }
  #quota-bar .qlabel { color: var(--cyan); font-weight: 600; letter-spacing: 0.03em; }
  #quota-bar .qpct { color: var(--text); font-weight: 600; }
  #quota-bar .qpct.warn { color: var(--yellow); }
  #quota-bar .qpct.hot { color: var(--red); }
  .qmeter {
    flex: 1 1 180px;
    max-width: 320px;
    height: 8px;
    background: #21262d;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .qmeter > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .qmeter.hot > i { background: linear-gradient(90deg, var(--yellow), var(--red)); }
  main {
    padding: 1.25rem 1.5rem 2.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-family: var(--font);
    font-size: 0.9rem;
  }
  .empty code {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    color: var(--cyan);
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem 0.95rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border);
  }
  .card.ok::before { background: var(--green); }
  .card.warn::before { background: var(--yellow); }
  .card.bad::before { background: var(--red); }
  .card.idle::before { background: var(--dim); }
  .card.human::before { background: var(--orange); }
  .card:hover { background: var(--bg-card-hi); border-color: #484f58; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .name {
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .path {
    font-family: var(--font);
    font-size: 0.68rem;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    font-family: var(--font);
    font-size: 0.68rem;
    padding: 0.18rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
    white-space: nowrap;
  }
  .chip.btn {
    cursor: pointer;
    user-select: none;
  }
  .chip.btn:hover { border-color: var(--orange); color: var(--orange); }
  .chip.green { color: var(--green); background: var(--green-bg); border-color: rgba(63,185,80,0.35); }
  .chip.red { color: var(--red); background: var(--red-bg); border-color: rgba(248,81,73,0.35); }
  .chip.yellow { color: var(--yellow); background: var(--yellow-bg); border-color: rgba(210,153,34,0.35); }
  .chip.cyan { color: var(--cyan); background: var(--cyan-bg); border-color: rgba(57,210,192,0.3); }
  .chip.orange { color: var(--orange); background: rgba(240,136,62,0.12); border-color: rgba(240,136,62,0.35); }
  .chip.purple { color: var(--purple); background: rgba(163,113,247,0.12); border-color: rgba(163,113,247,0.3); }
  .kv {
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    gap: 0.25rem 0.6rem;
    font-size: 0.8rem;
  }
  .kv dt {
    font-family: var(--font);
    font-size: 0.68rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding-top: 0.1rem;
  }
  .kv dd {
    margin: 0;
    font-family: var(--font);
    font-size: 0.78rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kv dd.muted { color: var(--muted); }
  .kv dd.task, .kv dd.wrap { white-space: normal; line-height: 1.35; color: var(--muted); }
  .phases {
    display: flex;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    background: #21262d;
    border: 1px solid var(--border);
  }
  .phases > i { display: block; height: 100%; min-width: 0; }
  .phases .p-coding { background: var(--cyan); }
  .phases .p-research { background: var(--purple); }
  .phases .p-reviewing { background: var(--yellow); }
  .phases .p-advising { background: var(--orange); }
  .phases .p-ci { background: var(--red); }
  .phases .p-planning { background: #58a6ff; }
  .phases .p-shell { background: #6e7681; }
  .phases .p-other { background: #484f58; }
  .phase-legend {
    font-family: var(--font);
    font-size: 0.62rem;
    color: var(--dim);
    display: flex; flex-wrap: wrap; gap: 0.35rem 0.7rem;
  }
  .footer-note {
    margin-top: auto;
    padding-top: 0.4rem;
    font-family: var(--font);
    font-size: 0.65rem;
    color: var(--dim);
    border-top: 1px solid transparent;
  }
  footer {
    padding: 0.75rem 1.5rem 1.5rem;
    font-family: var(--font);
    font-size: 0.7rem;
    color: var(--dim);
    text-align: center;
  }
  /* NEEDS-HUMAN modal */
  #nh-modal {
    display: none;
    position: fixed; inset: 0;
    z-index: 50;
    background: rgba(1, 4, 9, 0.72);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #nh-modal.open { display: flex; }
  #nh-panel {
    width: min(560px, 100%);
    max-height: min(80vh, 720px);
    overflow: auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.45);
    padding: 1.1rem 1.2rem 1rem;
  }
  #nh-panel h2 {
    margin: 0 0 0.25rem;
    font-size: 1rem;
    font-family: var(--font);
    color: var(--orange);
  }
  #nh-panel .sub {
    font-family: var(--font);
    font-size: 0.7rem;
    color: var(--dim);
    margin-bottom: 0.85rem;
  }
  #nh-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.45rem; }
  #nh-list li {
    font-family: var(--font);
    font-size: 0.78rem;
    line-height: 1.4;
    padding: 0.55rem 0.65rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--text);
    background: rgba(13,17,23,0.5);
  }
  #nh-list li.blocking {
    border-color: rgba(248,81,73,0.4);
    color: #ffb4af;
  }
  #nh-close {
    margin-top: 0.9rem;
    font-family: var(--font);
    font-size: 0.75rem;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  #nh-close:hover { color: var(--text); border-color: #484f58; }
</style>
</head>
<body>
<header>
  <h1>◤ PLINTH <span>dash</span></h1>
  <div class="meta">
    <span><span id="live-dot" class="dot spin"></span> <span id="live-label">loading</span></span>
    <span id="gen-ago">—</span>
    <span id="discovery">—</span>
    <span id="count">—</span>
  </div>
</header>
<div id="quota-bar"><div class="qrow"><span class="qlabel">QUOTA</span><span>loading…</span></div></div>
<main id="grid">
  <div class="empty">Loading snapshot…</div>
</main>
<footer>
  Local-only · 127.0.0.1 · may probe CLI /usage → /tmp/plinth-dash-quota-$UID cache ·
  <code style="color:var(--muted)">plinth watch</code> stays the TTY dashboard
</footer>
<div id="nh-modal" role="dialog" aria-modal="true" aria-labelledby="nh-title">
  <div id="nh-panel">
    <h2 id="nh-title">NEEDS-HUMAN</h2>
    <div class="sub" id="nh-sub"></div>
    <ul id="nh-list"></ul>
    <button type="button" id="nh-close">Close</button>
  </div>
</div>
<script>
(function () {
  const grid = document.getElementById("grid");
  const liveDot = document.getElementById("live-dot");
  const liveLabel = document.getElementById("live-label");
  const genAgo = document.getElementById("gen-ago");
  const discoveryEl = document.getElementById("discovery");
  const countEl = document.getElementById("count");
  const quotaBar = document.getElementById("quota-bar");
  const nhModal = document.getElementById("nh-modal");
  const nhTitle = document.getElementById("nh-title");
  const nhSub = document.getElementById("nh-sub");
  const nhList = document.getElementById("nh-list");
  let lastGen = null;
  let lastQuota = null;
  let projectsByPath = {};
  // Sticky diagnostic under the header when a later poll fails after cards exist.
  let errBanner = document.getElementById("poll-error");
  if (!errBanner) {
    errBanner = document.createElement("div");
    errBanner.id = "poll-error";
    errBanner.style.cssText =
      "display:none;font-family:var(--font);font-size:0.75rem;color:var(--red);" +
      "padding:0.4rem 1.5rem;border-bottom:1px solid var(--border);background:var(--red-bg)";
    const hdr = document.querySelector("header");
    if (hdr && hdr.parentNode) hdr.parentNode.insertBefore(errBanner, hdr.nextSibling);
  }

  function hum(secs) {
    if (secs == null || secs < 0 || Number.isNaN(secs)) return "—";
    secs = Math.floor(secs);
    if (secs < 60) return secs + "s";
    if (secs < 3600) return Math.floor(secs / 60) + "m " + (secs % 60) + "s";
    return Math.floor(secs / 3600) + "h " + Math.floor((secs % 3600) / 60) + "m";
  }
  function humK(n) {
    if (n == null) return "—";
    if (n >= 1e6) return (Math.floor(n / 1e5) / 10) + "M";
    if (n >= 1e3) return (Math.floor(n / 100) / 10) + "k";
    return String(n);
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function whenLocal(epoch) {
    if (epoch == null || Number.isNaN(epoch)) return null;
    try {
      return new Date(epoch * 1000).toLocaleString(undefined, {
        weekday: "short", month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit"
      });
    } catch (_) { return null; }
  }

  function cardTone(p) {
    if (p.error) return "bad";
    const r = p.review;
    if (r && r.last_error) return "bad";
    if (p.needs_human && p.needs_human.open > 0) return "human";
    if (!r) return p.feedless ? "idle" : "idle";
    if (r.running) return "warn";
    if (r.stale) return "bad";
    if (r.verdict === "APPROVED") return "ok";
    if (r.verdict === "CHANGES_NEEDED" || r.verdict === "UNBOUND") return "warn";
    return "idle";
  }

  const PHASE_ORDER = ["coding", "research", "reviewing", "advising", "ci", "planning", "shell", "other"];
  const PHASE_CLASS = {
    coding: "p-coding", research: "p-research", reviewing: "p-reviewing",
    advising: "p-advising", ci: "p-ci", planning: "p-planning",
    shell: "p-shell", other: "p-other"
  };

  function phaseBar(phases) {
    if (!phases || typeof phases !== "object") return "";
    let total = 0;
    const parts = [];
    for (const k of PHASE_ORDER) {
      const v = Number(phases[k] || 0);
      if (v > 0) { total += v; parts.push([k, v]); }
    }
    // include unknown keys
    for (const k of Object.keys(phases)) {
      if (PHASE_ORDER.indexOf(k) >= 0) continue;
      const v = Number(phases[k] || 0);
      if (v > 0) { total += v; parts.push([k, v]); }
    }
    if (total <= 0) return "";
    const segs = parts.map(([k, v]) => {
      const pct = Math.max(2, Math.round((v / total) * 100));
      const cls = PHASE_CLASS[k] || "p-other";
      return '<i class="' + cls + '" style="width:' + pct + '%" title="' +
        esc(k) + ': ' + hum(v) + '"></i>';
    }).join("");
    const legend = parts
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5)
      .map(([k, v]) => esc(k) + " " + hum(v))
      .join(" · ");
    return (
      '<div class="phases">' + segs + "</div>" +
      '<div class="phase-legend">' + legend + " · Σ " + hum(total) + "</div>"
    );
  }

  function modelsLine(p) {
    const m = p.models || {};
    const live = m.live || {};
    const seats = m.seats || {};
    const liveBits = [];
    const seatBits = [];
    const drv = p.model_driver || live.driver;
    if (drv) liveBits.push("drv " + drv);
    const rev = p.model_reviewer || live.reviewer;
    if (rev || live.reviewer_vendor) {
      liveBits.push("rev " + [live.reviewer_vendor, rev].filter(Boolean).join("/"));
    }
    if (seats.reviewer_vendor || seats.reviewer_tier1 || seats.reviewer_tier2) {
      seatBits.push("rev " + [
        seats.reviewer_vendor,
        seats.reviewer_tier2 ? "t2=" + seats.reviewer_tier2 : null,
        seats.reviewer_tier1 ? "t1=" + seats.reviewer_tier1 : null
      ].filter(Boolean).join("/"));
    }
    if (seats.audit_vendor || seats.audit_model) {
      seatBits.push("aud " + [seats.audit_vendor, seats.audit_model].filter(Boolean).join("/"));
    }
    if (seats.advisor_vendor || seats.advisor_model || seats.advisor_model_max) {
      seatBits.push("adv " + [
        seats.advisor_vendor,
        seats.advisor_model,
        seats.advisor_model_max ? "max=" + seats.advisor_model_max : null
      ].filter(Boolean).join("/"));
    }
    const parts = [];
    if (liveBits.length) parts.push("live " + liveBits.join(" · "));
    if (seatBits.length) parts.push("seats " + seatBits.join(" · "));
    return parts.join(" | ") || "—";
  }

  // Pure card builder — exercised by smoke via globalThis.__plinthDash (no DOM).
  function cardHTML(p) {
    const tone = cardTone(p);
    const chips = [];
    if (p.error) chips.push('<span class="chip red">error: ' + esc(p.error) + "</span>");
    if (p.feedless) chips.push('<span class="chip">feedless</span>');
    if (p.needs_human && p.needs_human.open > 0) {
      const blk = p.needs_human.blocking > 0
        ? " · " + p.needs_human.blocking + " blocking" : "";
      chips.push(
        '<button type="button" class="chip orange btn" data-nh="' + esc(p.path) +
        '" title="Open queue">NEEDS-HUMAN ×' + p.needs_human.open + blk + "</button>"
      );
    }
    const r = p.review;
    if (r) {
      if (r.running) {
        chips.push('<span class="chip yellow">round ' + esc(r.round) + " RUNNING</span>");
      } else if (r.last_error) {
        chips.push('<span class="chip red">review infra error</span>');
      } else if (r.verdict === "APPROVED") {
        chips.push('<span class="chip green">APPROVED</span>');
      } else if (r.verdict === "CHANGES_NEEDED") {
        chips.push('<span class="chip yellow">CHANGES_NEEDED</span>');
      } else if (r.verdict === "UNBOUND") {
        chips.push('<span class="chip yellow">UNBOUND</span>');
      } else if (r.verdict) {
        chips.push('<span class="chip">' + esc(r.verdict) + "</span>");
      }
      if (r.stale) chips.push('<span class="chip red">stale ≠ HEAD</span>');
      if (r.round != null && !r.running) chips.push('<span class="chip">r' + esc(r.round) + "</span>");
    } else if (!p.error) {
      chips.push('<span class="chip">no review</span>');
    }
    if (p.burn_per_min != null) {
      chips.push('<span class="chip cyan">' + humK(p.burn_per_min) + "/min</span>");
    }

    const activity = p.activity_secs_ago == null
      ? (p.feedless ? "no pulse feed" : "—")
      : hum(p.activity_secs_ago) + " ago";
    const session = p.session_secs == null ? "—" : hum(p.session_secs);
    const task = p.task ? esc(p.task) : '<span class="muted">—</span>';
    const revDetail = r
      ? (r.verdict || (r.running ? "running" : "—")) +
        (r.sha7 ? " @" + esc(r.sha7) : "") +
        (r.mode ? " · " + esc(r.mode) : "") +
        (r.tier != null ? " · tier " + r.tier : "")
      : "none on this branch";
    const models = modelsLine(p);
    const tokens = p.tokens_total != null
      ? humK(p.tokens_total) + " recent" + (p.tokens_window ? " (tail)" : "")
      : "unknown";
    const phases = phaseBar(p.phases);
    const revWall = (p.review_round_secs != null && p.review_round_secs > 0)
      ? hum(p.review_round_secs) : null;

    return (
      '<article class="card ' + tone + '" data-path="' + esc(p.path) + '">' +
        '<div class="row"><div class="name" title="' + esc(p.path) + '">' + esc(p.name) + "</div></div>" +
        '<div class="path" title="' + esc(p.path) + '">' + esc(p.path) + "</div>" +
        '<div class="chips">' + chips.join("") + "</div>" +
        '<dl class="kv">' +
          "<dt>branch</dt><dd>" + esc(p.branch) + " @ " + esc(p.head) + "</dd>" +
          "<dt>activity</dt><dd>" + esc(activity) + "</dd>" +
          "<dt>session</dt><dd>" + esc(session) + "</dd>" +
          "<dt>review</dt><dd>" + esc(revDetail) +
            (revWall ? " · wall " + esc(revWall) : "") + "</dd>" +
          "<dt>models</dt><dd class=\"wrap muted\">" + esc(models) + "</dd>" +
          "<dt>burn</dt><dd class=\"muted\">" +
            (p.burn_per_min != null ? humK(p.burn_per_min) + "/min · " : "") +
            tokens + "</dd>" +
          "<dt>task</dt><dd class=\"task\">" + task + "</dd>" +
        "</dl>" +
        (phases ? '<div>' + phases + "</div>" : "") +
        '<div class="footer-note">click NEEDS-HUMAN for open items · phases = event-gap heuristic (active SID)' +
          (revWall ? " · review wall " + esc(revWall) : "") + "</div>" +
      "</article>"
    );
  }

  function renderQuota(q) {
    lastQuota = q || null;
    if (!quotaBar) return;
    if (!q || q.skipped) {
      quotaBar.innerHTML =
        '<div class="qrow"><span class="qlabel">QUOTA</span>' +
        '<span>probes disabled</span></div>';
      return;
    }
    const o = q.overall;
    if (!q.available || !o) {
      const note = (q.note || "vendor plan unknown").slice(0, 120);
      const vend = (Array.isArray(q.vendors) ? q.vendors : []).map(function (v) {
        return v.vendor + (v.available ? "" : "×");
      }).join(" ");
      quotaBar.innerHTML =
        '<div class="qrow"><span class="qlabel">QUOTA</span>' +
        '<span>unavailable</span>' +
        (vend ? '<span class="dim">' + esc(vend) + "</span>" : "") +
        '<span title="' + esc(q.note || "") + '">' + esc(note) + "</span></div>";
      return;
    }
    const pct = o.used_pct;
    const cls = pct >= 90 ? "hot" : pct >= 70 ? "warn" : "";
    const meterCls = pct >= 90 ? "qmeter hot" : "qmeter";
    let proj = "—";
    if (o.projected_100pct_at != null) {
      const when = whenLocal(o.projected_100pct_at);
      const left = o.projected_100pct_at - Math.floor(Date.now() / 1000);
      proj = (when || ("@" + o.projected_100pct_at)) +
        (left > 0 ? " (in " + hum(left) + ")" : left === 0 ? " (now)" : " (overrun)");
    } else if (o.rate_pct_per_hour == null) {
      proj = "need ≥2 samples (≥10m apart)";
    }
    const reset = o.reset_text ? esc(o.reset_text) : "—";
    const rate = o.rate_pct_per_hour != null ? o.rate_pct_per_hour + "%/h" : "—";
    const age = q.refreshed_at != null
      ? hum(Math.max(0, Math.floor(Date.now() / 1000) - q.refreshed_at)) + " ago"
      : "—";
    quotaBar.innerHTML =
      '<div class="qrow">' +
        '<span class="qlabel">WEEKLY TOTAL</span>' +
        '<span class="qpct ' + cls + '">' + esc(String(pct)) + "% used</span>" +
        '<div class="' + meterCls + '"><i style="width:' + Math.min(100, pct) + '%"></i></div>' +
        '<span>reset ' + reset + "</span>" +
        '<span>→100% ' + esc(proj) + "</span>" +
        '<span>rate ' + esc(String(rate)) + "</span>" +
        '<span>polled ' + esc(age) + "</span>" +
      "</div>";
  }

  function openNeedsHuman(path) {
    const p = projectsByPath[path];
    if (!p) return;
    if (!nhModal || !nhList || !nhTitle || !nhSub) return; // node smoke has no modal DOM
    const items = (p.needs_human && p.needs_human.items) || [];
    nhTitle.textContent = "NEEDS-HUMAN — " + (p.name || path);
    nhSub.textContent =
      (p.needs_human && p.needs_human.open != null ? p.needs_human.open : items.length) +
      " open · " +
      (p.needs_human && p.needs_human.blocking ? p.needs_human.blocking : 0) +
      " blocking · " + path +
      " · " + (p.needs_human && p.needs_human.source
        ? p.needs_human.source
        : ".plinth/NEEDS-HUMAN.md");
    if (!items.length) {
      nhList.innerHTML = '<li class="muted">(no open item text — counts only or empty parse)</li>';
    } else {
      nhList.innerHTML = items.map(function (it) {
        const text = typeof it === "string" ? it : (it.text || "");
        const blk = typeof it === "object" && it.blocking;
        return '<li class="' + (blk ? "blocking" : "") + '">' + esc(text) + "</li>";
      }).join("");
    }
    if (p.needs_human && p.needs_human.truncated) {
      nhList.innerHTML +=
        '<li class="muted">… list truncated at 50 — run <code>plinth queue</code> for the full queue</li>';
    }
    nhModal.classList.add("open");
  }
  function closeNeedsHuman() {
    if (nhModal) nhModal.classList.remove("open");
  }
  // DOM wiring is browser-only; the node smoke harness loads the script without
  // a full document tree for pure cardHTML/cardTone tests.
  const nhClose = document.getElementById("nh-close");
  if (nhClose) nhClose.addEventListener("click", closeNeedsHuman);
  if (nhModal) {
    nhModal.addEventListener("click", function (e) {
      if (e.target === nhModal) closeNeedsHuman();
    });
  }
  if (typeof document.addEventListener === "function") {
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeNeedsHuman();
    });
  }
  if (grid && typeof grid.addEventListener === "function") {
    grid.addEventListener("click", function (e) {
      const t = e.target && e.target.closest ? e.target.closest("[data-nh]") : null;
      if (t) openNeedsHuman(t.getAttribute("data-nh"));
    });
  }

  function render(data) {
    lastGen = data.generated_at;
    discoveryEl.textContent = data.discovery || "—";
    const projects = data.projects || [];
    countEl.textContent = projects.length + " project" + (projects.length === 1 ? "" : "s");
    projectsByPath = {};
    projects.forEach(function (p) { if (p && p.path) projectsByPath[p.path] = p; });
    renderQuota(data.quota);

    if (!projects.length) {
      grid.innerHTML =
        '<div class="empty">No Plinth projects found.<br><br>' +
        'Default discovery: <code>~/Dev/*/.plinth/config</code><br>' +
        'Or list paths in <code>~/.config/plinth/dashboard-projects</code><br>' +
        'Or set <code>PLINTH_DASH_ROOTS=path:path</code></div>';
      return;
    }

    // Sort: needs-human first, then running review, then name
    projects.sort((a, b) => {
      const ah = (a.needs_human && a.needs_human.open) || 0;
      const bh = (b.needs_human && b.needs_human.open) || 0;
      if (ah !== bh) return bh - ah;
      const ar = a.review && a.review.running ? 1 : 0;
      const br = b.review && b.review.running ? 1 : 0;
      if (ar !== br) return br - ar;
      return (a.name || "").localeCompare(b.name || "");
    });

    grid.innerHTML = projects.map(cardHTML).join("");
  }

  // Smoke-test seam: pure helpers without a browser (see smoke-snapshot.sh).
  globalThis.__plinthDash = {
    cardTone: cardTone, cardHTML: cardHTML, esc: esc,
    modelsLine: modelsLine, phaseBar: phaseBar, renderQuota: renderQuota,
    openNeedsHuman: openNeedsHuman, closeNeedsHuman: closeNeedsHuman,
    seedProjects: function (ps) {
      projectsByPath = {};
      (ps || []).forEach(function (p) { if (p && p.path) projectsByPath[p.path] = p; });
    }
  };

  function tickClocks() {
    if (lastGen == null) return;
    const ago = Math.floor(Date.now() / 1000) - lastGen;
    genAgo.textContent = "snap " + hum(Math.max(0, ago)) + " ago";
    if (lastQuota && lastQuota.available && lastQuota.overall) renderQuota(lastQuota);
  }

  // Serialize polls: never start a new fetch while one is pending. Slow
  // multi-project snapshots must not fan out concurrent subprocesses or let
  // an older response overwrite a newer one.
  let pollInFlight = false;
  let pollSeq = 0;
  async function poll() {
    if (pollInFlight) return;
    pollInFlight = true;
    const seq = ++pollSeq;
    liveDot.className = "dot spin";
    try {
      const res = await fetch("/api/snapshot", { cache: "no-store" });
      let data = null;
      try { data = await res.json(); } catch (_) { data = null; }
      if (!res.ok) {
        const detail = data && (data.detail || data.error);
        throw new Error(detail || ("HTTP " + res.status));
      }
      if (data && data.error) throw new Error(data.detail || data.error);
      // Only apply if we are still the latest completed sequence owner.
      if (seq === pollSeq) {
        render(data);
        liveDot.className = "dot";
        liveLabel.textContent = "live";
        if (errBanner) { errBanner.style.display = "none"; errBanner.textContent = ""; }
      }
    } catch (e) {
      if (seq === pollSeq) {
        liveDot.className = "dot err";
        liveLabel.textContent = "error";
        const msg = e && e.message ? e.message : String(e);
        // Always surface actionable detail (even when stale cards remain).
        if (errBanner) {
          errBanner.style.display = "block";
          errBanner.textContent = "Snapshot failed: " + msg;
        }
        if (!grid.querySelector(".card")) {
          grid.innerHTML = '<div class="empty">Snapshot failed: ' + esc(msg) + "</div>";
        }
      }
    } finally {
      pollInFlight = false;
      tickClocks();
    }
  }

  // Test seam: expose poll controller for the smoke harness.
  globalThis.__plinthDash.poll = poll;
  globalThis.__plinthDash.getPollState = function () {
    return { inFlight: pollInFlight, seq: pollSeq };
  };
  globalThis.__plinthDash.openNeedsHuman = openNeedsHuman;

  poll();
  setInterval(poll, 2000);
  setInterval(tickClocks, 1000);
})();
</script>
</body>
</html>
